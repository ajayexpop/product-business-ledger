<meta charset="utf-8">
<title>Ledger Rewire Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky 64px nav, one working column capped at 1200px; Home opens on a dark band of elevated stat cards,
   every other tab on the white canvas. Tokens follow docs/design.md: one blue accent, weight-400 display type,
   pill controls, 24px cards, mono numbers, one shadow tier. */
:root{
  --primary:#0052ff; --primary-active:#003ecc; --primary-text:#0052ff; --primary-soft:#e6eeff;
  --ink:#0a0b0d; --body:#5b616e; --muted:#7c828a; --muted-soft:#a8acb3;
  --hairline:#dee1e6; --hairline-soft:#eef0f3;
  --canvas:#ffffff; --surface-soft:#f7f7f7; --surface-strong:#eef0f3; --card:#ffffff;
  --band:#0a0b0d; --band-card:#16181c; --band-line:#2a2e35; --on-band:#ffffff; --on-band-soft:#a8acb3;
  --up:#05b169; --up-text:#037a49; --down:#cf202f; --down-text:#b3131f;
  --sev-u:#7d0f1a; --sev-h:#cf202f; --sev-m:#ea8a91; --sev-l:#f4c9cd;
  --ship:#0052ff; --prog:#9db8ff; --track:#eef0f3;
  --shadow:0 4px 12px rgba(0,0,0,.04);
  --sans:"Inter",-apple-system,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --primary:#0052ff; --primary-active:#2f6bff; --primary-text:#6b98ff; --primary-soft:#14234a;
  --ink:#ffffff; --body:#b4b9c1; --muted:#8d939c; --muted-soft:#5f656e;
  --hairline:#2a2e35; --hairline-soft:#1e2126;
  --canvas:#0a0b0d; --surface-soft:#111316; --surface-strong:#1e2126; --card:#16181c;
  --band:#000000; --band-card:#16181c; --band-line:#2a2e35; --on-band:#ffffff; --on-band-soft:#a8acb3;
  --up:#05b169; --up-text:#3ecf8e; --down:#e5484d; --down-text:#ff6b72;
  --sev-u:#ff4d5a; --sev-h:#d9303e; --sev-m:#8f3a43; --sev-l:#4d2a2f;
  --ship:#3d7bff; --prog:#1f3a78; --track:#1e2126;
  --shadow:0 4px 12px rgba(0,0,0,.4); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --primary:#0052ff; --primary-active:#2f6bff; --primary-text:#6b98ff; --primary-soft:#14234a;
  --ink:#ffffff; --body:#b4b9c1; --muted:#8d939c; --muted-soft:#5f656e;
  --hairline:#2a2e35; --hairline-soft:#1e2126;
  --canvas:#0a0b0d; --surface-soft:#111316; --surface-strong:#1e2126; --card:#16181c;
  --band:#000000; --band-card:#16181c; --band-line:#2a2e35; --on-band:#ffffff; --on-band-soft:#a8acb3;
  --up:#05b169; --up-text:#3ecf8e; --down:#e5484d; --down-text:#ff6b72;
  --sev-u:#ff4d5a; --sev-h:#d9303e; --sev-m:#8f3a43; --sev-l:#4d2a2f;
  --ship:#3d7bff; --prog:#1f3a78; --track:#1e2126;
  --shadow:0 4px 12px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--canvas);color:var(--body);font:400 16px/1.5 var(--sans);margin:0;font-feature-settings:"cv11","ss01"}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
a{color:var(--primary-text);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
.num{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:0}
.wrap{max-width:1200px;margin:0 auto;padding-inline:24px}
@media (max-width:640px){.wrap{padding-inline:16px}}

/* type scale (docs/design.md) */
.t-display{font-size:44px;line-height:1.09;letter-spacing:-1px;font-weight:400;color:var(--ink);margin:0;text-wrap:balance}
.t-page{font-size:36px;line-height:1.11;letter-spacing:-.5px;font-weight:400;color:var(--ink);margin:0;text-wrap:balance}
.t-title{font-size:18px;line-height:1.33;font-weight:600;color:var(--ink);margin:0}
.t-label{font-size:16px;line-height:1.25;font-weight:600;color:var(--ink)}
.t-small{font-size:14px;line-height:1.5}
.t-cap{font-size:13px;line-height:1.5;color:var(--muted)}
@media (max-width:640px){.t-display{font-size:32px;letter-spacing:-.6px}.t-page{font-size:30px}}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--canvas);border-bottom:1px solid var(--hairline)}
.nav-in{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand img{height:44px;width:auto;display:block;margin-block:-6px}
.brand .logo-dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand .logo-light{display:none}:root:not([data-theme="light"]) .brand .logo-dark{display:block}}
:root[data-theme="dark"] .brand .logo-light{display:none}
:root[data-theme="dark"] .brand .logo-dark{display:block}
.brand span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{height:40px;padding:0 14px;border-radius:100px;font-size:16px;font-weight:600;color:var(--body);white-space:nowrap;flex:none}
.tab:hover{color:var(--ink);background:var(--surface-strong)}
.tab[aria-selected="true"]{color:var(--ink);background:var(--surface-strong)}
.navsearch{display:none}
.navsearch input{width:100%}
@media (max-width:1180px){.navsearch{display:none}}

/* controls */
.pill-in{height:44px;border-radius:100px;background:var(--surface-strong);border:1px solid transparent;padding:0 20px;font:400 16px var(--sans);color:var(--ink);outline:none;min-width:0}
.pill-in::placeholder{color:var(--muted)}
.pill-in:focus{border-color:var(--primary);background:var(--canvas)}
select.pill-in{appearance:none;-webkit-appearance:none;padding-right:40px;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 22px) 19px,calc(100% - 17px) 19px;background-size:5px 5px;background-repeat:no-repeat}
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:100px;font-size:16px;font-weight:600;line-height:1.15;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:active{background:var(--primary-active)}
.btn-primary[disabled]{background:#a8b8cc;cursor:not-allowed}
.btn-secondary{background:var(--surface-strong);color:var(--ink)}
.btn-text{color:var(--primary-text);height:auto;padding:0}
.btn-sm{height:36px;padding:0 16px;font-size:14px}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:100px;background:var(--surface-strong);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{height:36px;padding:0 16px;border-radius:100px;font-size:14px;font-weight:600;color:var(--body);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--canvas);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:24px}
.filters .pill-in{flex:0 1 auto}
.filters .grow{flex:1 1 220px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.fchip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 8px 0 14px;border-radius:100px;background:var(--primary-soft);color:var(--primary-text);font-size:14px;font-weight:600}
.fchip b{font-weight:600}
.fchip span{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:14px}
.fchip:hover span{background:rgba(0,82,255,.15)}

/* badges and state chips: text colour only, never a fill for semantic state */
.badge{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:100px;background:var(--surface-strong);color:var(--ink);font-size:12px;font-weight:600;line-height:1;white-space:nowrap}
.badge.t1{background:var(--ink);color:var(--canvas)}
.state{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:100px;border:1px solid var(--hairline);font-size:12px;font-weight:600;line-height:1;white-space:nowrap;color:var(--body)}
.state::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.state.act{color:var(--down-text);border-color:currentColor}
.state.watch{color:var(--ink)}
.state.clear{color:var(--up-text)}
.state.none::before{display:none}
.sev{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap}
.sev i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* layout blocks */
main{padding-block:0 160px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-top:48px}
.page-head .t-cap{margin-top:8px;max-width:70ch;font-size:16px;color:var(--body)}
.section{margin-top:48px}
.section-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;margin-bottom:16px}
.section-head .t-cap{max-width:72ch}
.card{background:var(--card);border:1px solid var(--hairline);border-radius:24px;padding:32px;min-width:0}
@media (max-width:640px){.card{padding:20px;border-radius:16px}}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.grid2.g-l{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.grid2.g-r{grid-template-columns:minmax(0,1fr) minmax(0,1.45fr)}
@media (max-width:960px){.grid2,.grid2.g-l,.grid2.g-r{grid-template-columns:1fr}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{padding:16px;border-radius:16px;gap:8px}.stat .v{font-size:26px}}
@media (max-width:640px){.hbar{grid-template-columns:minmax(0,36%) minmax(0,1fr) 40px;gap:8px}}

/* stat cards */
.stat{display:flex;flex-direction:column;gap:12px;text-align:left;border-radius:24px;padding:24px;background:var(--card);border:1px solid var(--hairline);min-width:0}
.stat:hover{box-shadow:var(--shadow)}
.stat .l{font-size:14px;font-weight:500;color:var(--body)}
.stat .v{font-family:var(--mono);font-weight:500;font-size:32px;line-height:1.13;color:var(--ink);font-variant-numeric:tabular-nums}
.stat .v small{font-size:18px;color:var(--muted);font-weight:400}
.stat .d{font-size:13px;color:var(--muted);line-height:1.45}
.stat .go{font-size:13px;font-weight:600;color:var(--primary-text);margin-top:auto}
.band{background:var(--band);color:var(--on-band);padding-block:48px;border-bottom:1px solid var(--band-line)}
.band .t-display{color:var(--on-band)}
.band .lede{color:var(--on-band-soft);font-size:16px;margin-top:12px;max-width:70ch}
.band .stat{background:var(--band-card);border-color:var(--band-line)}
.band .stat .l{color:var(--on-band-soft)}
.band .stat .v{color:var(--on-band)}
.band .stat .d{color:var(--on-band-soft)}
.band .stat .go{color:#8fb0ff}
.band .stat:hover{border-color:#3a3f48}
.roles{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:32px}
.roles button{height:40px;padding:0 18px;border-radius:100px;background:var(--band-card);color:var(--on-band);font-size:14px;font-weight:600;border:1px solid var(--band-line)}
.roles button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary)}
.roles .rl{font-size:13px;color:var(--on-band-soft);align-self:center;margin-right:4px}

/* marks */
.meter{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--track);gap:2px}
.band .meter{background:var(--band-line)}
.meter i{display:block;height:100%}
.hbar{display:grid;grid-template-columns:minmax(110px,200px) minmax(0,1fr) 56px;gap:12px;align-items:center;min-height:36px;width:100%;text-align:left;border-radius:8px;padding:2px 4px}
.hbar:hover{background:var(--surface-soft)}
.hbar .hl{font-size:14px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .hv{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.track{height:16px;border-radius:4px;background:var(--track);display:flex;overflow:hidden;gap:2px}
.track>i{display:block;height:100%;cursor:pointer}
.track>i:first-child{border-radius:4px 0 0 4px}
.track>i:last-child{border-radius:0 4px 4px 0}
.track>i:only-child{border-radius:4px}
.track.trans{background:transparent}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13px;color:var(--body);margin-top:16px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend .ring{border-radius:50%;border:2px solid var(--ink);width:10px;height:10px}
.count{font-family:var(--mono);font-size:13px;color:var(--muted)}

/* lists */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:16px;padding:16px 8px;border-top:1px solid var(--hairline);width:100%;text-align:left;min-width:0}
.row:first-child{border-top:0}
button.row:hover,a.row:hover{background:var(--surface-soft);text-decoration:none}
.row .main{flex:1;min-width:0}
.row .main .t-label{display:block;overflow-wrap:anywhere}
.row .sub{font-size:14px;color:var(--body);margin-top:2px;overflow-wrap:anywhere}
.row .end{display:flex;align-items:center;gap:8px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.row .rank{font-family:var(--mono);font-size:14px;color:var(--muted);width:24px;flex:none;text-align:right}
.date{flex:none;width:52px;text-align:center}
.date b{display:block;font-family:var(--mono);font-size:22px;font-weight:500;color:var(--ink);line-height:1.1}
.date span{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.minibar{width:120px;flex:none}
@media (max-width:640px){.minibar{width:72px}.row{gap:12px;padding:14px 4px}.row .end{max-width:45%}}
.empty{padding:32px 8px;text-align:center;color:var(--body)}
.empty .t-label{display:block;margin-bottom:6px}

/* tables */
.twrap{overflow-x:auto;margin-inline:-8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:13px;font-weight:600;color:var(--muted);padding:12px 8px;border-bottom:1px solid var(--hairline);white-space:nowrap;vertical-align:bottom}
td{padding:14px 8px;border-bottom:1px solid var(--hairline-soft);vertical-align:middle;color:var(--body)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-soft)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td .t-label{display:block}
.cname{min-width:190px}
.cname .t-cap{margin-top:2px}
th button{font:inherit;color:inherit}
th button[aria-sort]{color:var(--ink)}

/* health meter */
.hm{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.hm .segs{display:inline-flex;gap:2px}
.hm .segs i{width:5px;height:14px;border-radius:2px;background:var(--track)}
.hm .segs i.on{background:var(--ink)}
.hm .num{font-size:14px;color:var(--ink);min-width:28px}
.hm.good .num{color:var(--up-text)}
.hm.bad .num{color:var(--down-text)}
.hm.bad .segs i.on{background:var(--down)}

/* countdown */
.cd{display:flex;flex-direction:column;gap:6px;min-width:140px}
.cd .cdl{font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.cd .cdm{height:4px;border-radius:2px;background:var(--track);overflow:hidden}
.cd .cdm i{display:block;height:100%;background:var(--ink)}
.cd.act .cdm i{background:var(--down)}

/* timeline */
.tl{min-width:980px}
.tl-row{display:grid;grid-template-columns:220px repeat(12,minmax(0,1fr));border-top:1px solid var(--hairline-soft)}
.tl-row.head{border-top:0;position:sticky;top:0}
.tl-row.head div{font-size:13px;font-weight:600;color:var(--muted);padding:8px 4px;text-align:center}
.tl-row.head div:first-child{text-align:left;padding-left:8px}
.tl-row.head .now{color:var(--primary-text)}
.tl-name{padding:10px 8px;text-align:left;min-width:0}
.tl-name .t-label{font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-name .t-cap{font-size:13px}
.tl-cell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:58px;padding:6px 2px;border-left:1px solid var(--hairline-soft)}
.tl-cell:hover{background:var(--surface-soft)}
.tl-cell.now{background:var(--primary-soft)}
.tl-cell.show::before{content:"";position:absolute;left:50%;top:5px;width:16px;margin-left:-8px;height:4px;border-radius:2px;background:var(--ink)}
.tl-cell .up,.tl-cell .dn{font-family:var(--mono);font-size:12px;font-weight:500;min-width:26px;height:20px;border-radius:6px;display:inline-grid;place-items:center;padding:0 5px}
.tl-cell .up{background:var(--ship);color:#fff}
.tl-cell .dn{background:var(--sev-h);color:#fff}
.tl-cell .dn.u{background:var(--sev-u)}
.tl-cell .ring{position:absolute;right:6px;bottom:6px;width:9px;height:9px;border-radius:50%;border:2px solid var(--ink)}
.mchart{display:grid;grid-template-columns:220px repeat(12,minmax(0,1fr));align-items:end;height:150px;min-width:980px}
.mchart .col{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:0;cursor:pointer;border-radius:8px}
.mchart .col:hover{background:var(--surface-soft)}
.mchart .col .upb,.mchart .col .dnb{width:40%;max-width:28px;border-radius:4px}
.mchart .col .upb{background:var(--ship)}
.mchart .col .dnb{background:var(--sev-h)}
.mchart .col .ax{height:1px;width:80%;background:var(--hairline);margin:2px 0}
.mchart .col b{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--ink);line-height:1.4}
.mchart .col .dnl{color:var(--down-text)}
.mchart .yl{font-size:13px;color:var(--muted);align-self:center;padding-left:8px}

/* ladder */
.ladder{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.step{position:relative;text-align:left;border-radius:16px;padding:16px;background:var(--surface-soft);border:1px solid var(--hairline-soft);min-width:0}
.step:hover{border-color:var(--hairline)}
.step[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.step .sn{font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
.step .sn i{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-style:normal;font-family:var(--mono);font-size:12px;background:var(--canvas);border:1px solid var(--hairline);color:var(--ink)}
.step .sv{font-family:var(--mono);font-size:28px;font-weight:500;color:var(--ink);margin-top:6px;line-height:1.1}
.step .sd{font-size:13px;color:var(--muted)}
@media (max-width:760px){.ladder{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:16px;overflow-x:auto;padding-bottom:8px}
.bcol{background:var(--surface-soft);border-radius:24px;padding:16px;min-width:0;display:flex;flex-direction:column;gap:10px}
.bcol-h{padding:4px 4px 8px}
.bcol-h .t-label{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bcol-h .meter{margin-top:10px}
.bcol-h .shows{margin-top:10px;display:flex;flex-direction:column;gap:4px}
.bcol-h .shows button{font-size:13px;color:var(--body);text-align:left}
.bcol-h .shows button b{color:var(--ink);font-weight:600}
.mhc{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--card);border:1px solid var(--hairline);border-radius:16px;padding:16px;width:100%}
.mhc:hover{box-shadow:var(--shadow)}
.mhc .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 8px}
.mhc .k{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.mhc .t-label{font-size:16px;line-height:1.35}

/* drawer */

.cdcard{display:flex;align-items:center;gap:20px;border-radius:16px;padding:20px;background:var(--surface-soft);width:100%;text-align:left}

.cdcard .big small{display:block;font-family:var(--sans);font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:6px}

.strip{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px}
.strip button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:8px;position:relative}

.strip .sb{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:36px;width:100%}

.strip .ml{font-size:11px;font-weight:600;color:var(--muted)}

.strip .flag{position:absolute;top:0;left:20%;right:20%;height:3px;border-radius:2px;background:var(--ink)}

.cite{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--primary-text);background:var(--primary-soft);border-radius:100px;padding:2px 10px;margin:4px 6px 0 0}

/* intake form */

/* theme switch */

/* how it works */
.priv{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--primary-text);background:var(--primary-soft);border-radius:100px;padding:6px 14px}
.rgroup{margin-top:32px}

.codebox{font-family:var(--mono);font-size:13px;line-height:1.55;color:var(--ink);background:var(--surface-soft);border-radius:12px;padding:14px 16px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}

.src-card{display:flex;flex-direction:column;gap:12px}

.spark{display:flex;align-items:flex-end;gap:3px;height:44px;padding-top:4px}
.spark i{flex:1;min-width:4px;max-width:14px;border-radius:2px 2px 0 0;background:var(--ship)}
.spark i.zero{background:var(--track);height:3px!important}
.spark i.man{background:var(--ink)}
.hday{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:28px 0 4px}
.hrow{display:grid;grid-template-columns:64px minmax(0,1fr);gap:16px;padding:14px 8px;border-top:1px solid var(--hairline-soft);width:100%;text-align:left}

.chg{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;font-size:14px;margin-top:6px}

/* intake matches */
.kchip{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:100px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid var(--hairline);color:var(--body);vertical-align:1px}

/* onboarding */
#ob-layer{position:fixed;inset:0;z-index:80;pointer-events:none}

.gi{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;padding:10px 12px;border-radius:12px}

.sugg:empty{display:none}

</style>

<button id="guide-btn" class="guide-btn" aria-label="Guide: tours and help">Guide</button>

<script>
'use strict';
const SHARE_BASE = 'https://claude.ai/artifact/BUv7s6D31RAuodnBFsqJ7o';
let D = null;
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('en-GB');
const plural = (n, w, p) => `${fmt(n)} ${n === 1 ? w : (p || w + 's')}`;
const TODAY = new Date(new Date().toDateString());
const dayMs = 864e5;
const toDate = iso => new Date(String(iso).slice(0,10) + 'T00:00:00');
const daysTo = iso => iso ? Math.round((toDate(iso) - TODAY) / dayMs) : null;
const ageOf = iso => iso ? Math.max(0, Math.round((TODAY - toDate(iso)) / dayMs)) : null;
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const monLabel = ym => { const [y, m] = ym.split('-'); return MON[+m - 1] + ' ' + y; };
const dShort = iso => { const d = toDate(iso); return d.getDate() + ' ' + MON[d.getMonth()]; };
const THIS_YM = TODAY.toISOString().slice(0,7);
const YEAR_MONTHS = Array.from({length:12}, (_, i) => '2026-' + String(i + 1).padStart(2, '0'));
const SEV = ['Urgent','High','Medium','Low'];
const SEVTOK = {Urgent:'--sev-u', High:'--sev-h', Medium:'--sev-m', Low:'--sev-l'};
const ROLES = [['ops','Ops and CS'],['engineering','Engineering'],['product','Product'],['sales','Sales'],['leadership','Leadership']];
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

const S = {
  tab: 'home', role: lsGet('rw.role') || 'ops',
  f: {tier: 'all', owner: 'all', team: 'all'},
  clients: {view: 'table', expert: false, q: '', preset: null, sort: 'show'},
  work: {view: 'mh', step: null, month: null, flag: null, q: '', bmonth: null},
  demand: {q: '', product: 'all', t1: false, built: 'all', more: false, client: null},
  quality: {view: 'bugs', q: '', sev: null, team: null, age: null, client: null, win: 30, incClient: null, more: false},
};

/* ---------- indexes and derived facts ---------- */
const IX = {};
function buildIndex(){
  IX.co = new Map(D.companies.map(c => [c.pd, c]));
  IX.bySlug = new Map(D.companies.map(c => [c.slug, c]));
  const by = key => { const m = new Map(D.companies.map(c => [c.pd, []])); return [m, (pd, x) => { if (m.has(pd)) m.get(pd).push(x); }]; };
  let add;
  [IX.bugs, add] = by(); D.bugs.forEach(b => { b.age = ageOf(b.cr); b.pds.forEach(pd => add(pd, b)); });
  [IX.inc, add] = by(); D.incidents.forEach(i => { i.open = i.st !== 'Done' && i.st !== 'Cancelled'; i.pds.forEach(pd => add(pd, i)); });
  [IX.ev, add] = by(); D.events.forEach(e => { e.in = daysTo(e.s); e.out = daysTo(e.e); add(e.pd, e); });
  [IX.st, add] = by(); D.stories.forEach(s => (s.pds || []).forEach(pd => add(pd, s)));
  [IX.mh, add] = by(); D.musthave.forEach(m => { m.step = stepOf(m.status); add(m.driver, m); });
  [IX.needs, add] = by(); D.needs.forEach(n => { n.t1 = n.cus.filter(c => c[1] === 1); n.cus.forEach(c => c[2] && add(String(c[2]), n)); });
  IX.needById = new Map(D.needs.map(n => [n.id, n]));
  IX.teams = [...new Set(D.bugs.map(b => b.team))].sort();
  IX.owners = [...new Set(D.companies.map(c => c.owner).filter(Boolean))].sort();
  D.companies.forEach(c => {
    const bugs = IX.bugs.get(c.pd), incs = IX.inc.get(c.pd);
    c.sev = {Urgent:0, High:0, Medium:0, Low:0}; bugs.forEach(b => c.sev[b.p] = (c.sev[b.p] || 0) + 1);
    c.open = bugs.length;
    c.incOpen = incs.filter(i => i.open).length;
    c.inc180 = incs.filter(i => i.st !== 'Cancelled' && ageOf(i.cr) <= 180).length;
    c.next = IX.ev.get(c.pd).find(e => e.out >= 0) || null;
    c.shipped = IX.st.get(c.pd).filter(s => s.sf === 'Shipped' && s.mo >= '2026-01').length;
    c.prog = IX.st.get(c.pd).filter(s => s.sf === 'In Progress').length;
    c.asks = IX.needs.get(c.pd).length;
    const bugPen = Math.min(6, 2 * c.sev.Urgent + c.sev.High + .5 * c.sev.Medium + .25 * c.sev.Low);
    c.health = Math.max(0, Math.round((10 - bugPen - 2 * c.incOpen - Math.min(2, .5 * c.inc180)) * 2) / 2);
    c.flag = flagOf(c);
    c.rdate = /\d{4}/.test(c.renewal) && !isNaN(Date.parse(c.renewal)) ? new Date(Date.parse(c.renewal)) : null;
    c.rin = c.rdate ? Math.round((c.rdate - TODAY) / dayMs) : null;
  });
  const evByKey = new Map(D.events.map(e => [e.k, e]));
  D.musthave.forEach(m => { const c = IX.co.get(m.driver); m.client = c || null;
    m.show = (m.forShow && evByKey.get(m.forShow)) || (c && c.next) || null;
    const end = m.month ? new Date(+m.month.slice(0,4), +m.month.slice(5,7), 0) : null;
    m.afterShow = !!(m.show && end && m.step !== 'Shipped' && toDate(m.show.s) < end && m.show.out >= 0) ? m.show : null; });
}
function stepOf(st){
  const s = String(st || '').toLowerCase();
  if (s === 'done') return 'Shipped';
  if (/progress|testing|release|review/.test(s)) return 'Building';
  if (/planned|discovery|ready to start|open/.test(s)) return 'Scheduled';
  return 'Scheduled';
}
function flagOf(c){
  if (!c.next) return {k:'none', t:'No show on record'};
  const d = c.next.in, uh = c.sev.Urgent + c.sev.High;
  if (d <= 30){ if (uh) return {k:'act', t:'Act now'}; if (c.open) return {k:'watch', t:'Watch'}; return {k:'clear', t:'Clear'}; }
  if (d <= 60){ if (c.sev.Urgent) return {k:'watch', t:'Watch'}; return {k:'clear', t:'Clear'}; }
  return {k:'none', t:'Show later'};
}
const whenWord = d => d == null ? '' : d < 0 ? 'running now' : d === 0 ? 'today' : d === 1 ? 'tomorrow' : `in ${d} days`;
const inFilters = c => !!c && (S.f.tier === 'all' || String(c.tier) === S.f.tier) && (S.f.owner === 'all' || c.owner === S.f.owner);

/* ---------- small renderers ---------- */
const tierBadge = t => t ? `<span class="badge${t === 1 ? ' t1' : ''}">Tier ${t}</span>` : '<span class="badge">No tier</span>';
const stateChip = f => `<span class="state ${f.k}">${esc(f.t)}</span>`;
const sevChip = p => `<span class="sev"><i style="background:var(${SEVTOK[p] || '--sev-m'})"></i>${esc(p)}</span>`;
function healthMeter(h){
  const cls = h >= 8 ? ' good' : h < 5 ? ' bad' : '';
  let segs = ''; for (let i = 1; i <= 10; i++) segs += `<i class="${i <= Math.round(h) ? 'on' : ''}"></i>`;
  return `<span class="hm${cls}" data-tip="Health ${h} of 10, worked out from open bugs and incidents"><span class="segs">${segs}</span><span class="num">${h}</span></span>`;
}
function sevTrack(sev, max, attrs){
  const tot = SEV.reduce((a, k) => a + (sev[k] || 0), 0);
  if (!tot) return `<div class="track"></div>`;
  return `<div class="track${max ? ' trans' : ''}">${SEV.filter(k => sev[k]).map(k =>
    `<i style="width:${(sev[k] / (max || tot) * 100).toFixed(2)}%;background:var(${SEVTOK[k]})" data-tip="${k}: ${sev[k]}" ${attrs ? attrs(k) : ''}></i>`).join('')}</div>`;
}
function splitTrack(a, b, max, tipA, tipB){
  const m = max || (a + b) || 1;
  return `<div class="track${max ? ' trans' : ''}">${a ? `<i style="width:${(a / m * 100).toFixed(2)}%;background:var(--ship)" data-tip="${esc(tipA)}"></i>` : ''}${b ? `<i style="width:${(b / m * 100).toFixed(2)}%;background:var(--prog)" data-tip="${esc(tipB)}"></i>` : ''}</div>`;
}
function countdown(e, act){
  if (!e) return '<span class="t-cap">No show on record</span>';
  const w = e.in < 0 ? 100 : Math.max(4, 100 - Math.min(90, e.in) / 90 * 100);
  return `<div class="cd${act ? ' act' : ''}"><span class="cdl">${esc(e.n)}</span><div class="cdm"><i style="width:${w.toFixed(0)}%"></i></div><span class="t-cap">${dShort(e.s)} · ${whenWord(e.in)}</span></div>`;
}
const stat = (label, value, desc, go, mark, extraAttr) => {
  const tag = go || extraAttr ? 'button' : 'div';
  return `<${tag} class="stat" ${go ? `data-go="${esc(go)}"` : ''} ${extraAttr || ''}><span class="l">${esc(label)}</span><span class="v">${value}</span>${mark || ''}<span class="d">${esc(desc)}</span>${go || extraAttr ? '<span class="go">Open the list</span>' : ''}</${tag}>`;
};
function fracMeter(part, whole, tok){ const w = whole ? part / whole * 100 : 0;
  return `<div class="meter"><i style="width:${w.toFixed(1)}%;background:var(${tok || '--primary'})"></i></div>`; }
function sevMeter(sev){ const tot = SEV.reduce((a, k) => a + (sev[k] || 0), 0) || 1;
  return `<div class="meter">${SEV.filter(k => sev[k]).map(k => `<i style="width:${(sev[k] / tot * 100).toFixed(1)}%;background:var(${SEVTOK[k]})"></i>`).join('')}</div>`; }
const clientLink = (c, label) => c ? `<a href="#client-${c.slug}" data-open="client:${c.slug}">${esc(label || c.short)}</a>` : '';
const sectionHead = (title, cap, right) => `<div class="section-head"><div><h2 class="t-title">${esc(title)}</h2>${cap ? `<div class="t-cap" style="margin-top:4px">${esc(cap)}</div>` : ''}</div>${right || ''}</div>`;
const legendSev = () => `<div class="legend">${SEV.map(k => `<span><i style="background:var(${SEVTOK[k]})"></i>${k}</span>`).join('')}</div>`;
function filterChips(list){
  const on = list.filter(x => x.on);
  if (!on.length) return '';
  return `<div class="chips" style="margin-top:16px">${on.map(x => `<button class="fchip" data-clear="${x.id}" aria-label="Remove filter ${esc(x.label)}"><b>${esc(x.label)}</b><span aria-hidden="true">×</span></button>`).join('')}</div>`;
}
function sharedFilters(opts){
  const o = opts || {};
  return `${o.search ? `<input class="pill-in grow" type="search" id="${o.search.id}" placeholder="${esc(o.search.ph)}" value="${esc(o.search.v)}" aria-label="${esc(o.search.ph)}">` : ''}
    <select class="pill-in" id="f-tier" aria-label="Tier"><option value="all">All tiers</option>${[1,2,3,4].map(t => `<option value="${t}" ${S.f.tier == t ? 'selected' : ''}>Tier ${t}</option>`).join('')}</select>
    <select class="pill-in" id="f-owner" aria-label="Owner"><option value="all">All owners</option>${IX.owners.map(o => `<option ${S.f.owner === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>
    ${o.team ? `<select class="pill-in" id="f-team" aria-label="Team"><option value="all">All teams</option>${IX.teams.map(t => `<option ${S.f.team === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>` : ''}
    ${o.extra || ''}`;
}
function sharedChips(extra){
  return filterChips([
    {id:'tier', on:S.f.tier !== 'all', label:'Tier ' + S.f.tier},
    {id:'owner', on:S.f.owner !== 'all', label:'Owner: ' + S.f.owner},
    {id:'team', on:S.f.team !== 'all', label:S.f.team},
  ].concat(extra || []));
}

/* ---------- HOME ---------- */
function renderHome(){
  const role = S.role;
  const cos = D.companies.filter(inFilters);
  const next30 = D.events.filter(e => e.in >= -3 && e.in <= 30 && e.out >= 0 && inFilters(IX.co.get(e.pd)));
  const act30 = cos.filter(c => c.flag.k === 'act');
  const urgentClients = cos.filter(c => c.sev.Urgent > 0);
  const bugs = D.bugs.filter(b => b.pds.some(pd => inFilters(IX.co.get(pd))));
  const bsev = {Urgent:0, High:0, Medium:0, Low:0}; bugs.forEach(b => bsev[b.p]++);
  const old90 = bugs.filter(b => b.age > 90);
  const incOpen = D.incidents.filter(i => i.open);
  const inc30 = D.incidents.filter(i => i.st !== 'Cancelled' && ageOf(i.cr) <= 30);
  const mhOpen = D.musthave.filter(m => m.step !== 'Shipped');
  const mhRisk = mhOpen.filter(m => m.afterShow || m.overdue);
  const withCus = D.needs.filter(n => n.cus.length);
  const t1Needs = D.needs.filter(n => n.t1.length);
  const inProg = D.stories.filter(s => s.sf === 'In Progress');
  const renew = cos.filter(c => c.rin != null && c.rin >= 0 && c.rin <= 180).sort((a, b) => a.rin - b.rin);
  const t1 = cos.filter(c => c.tier === 1);
  const eventsSoonClients = new Set(next30.map(e => e.pd));
  const pressureShows = next30.filter(e => { const c = IX.co.get(e.pd); return c.sev.Urgent + c.sev.High > 0; });
  let head, lede, stats, startTitle, startCap, start, blockTitle, blockCap, block;

  if (role === 'ops'){
    head = `${plural(new Set(next30.map(e => e.k)).size, 'show')} in the next 30 days. ${plural(act30.length, 'client')} need action before theirs opens.`;
    lede = 'Clients run events that last a few days. A bug open in the weeks before a show hurts them most. Start with the red rows, then open any client for the full picture.';
    stats = [
      stat('Shows in the next 30 days', fmt(next30.length), `${act30.length} clients with urgent or high bugs open`, 'quality-pressure', fracMeter(pressureShows.length, next30.length, '--down')),
      stat('Clients with an urgent bug', `${fmt(urgentClients.length)}<small> / ${cos.length}</small>`, 'open urgent bugs attached to a client', 'clients-urgent', fracMeter(urgentClients.length, cos.length, '--down')),
      stat('Incidents open', fmt(incOpen.length), `${inc30.length} raised in the last 30 days`, 'quality-incidents', fracMeter(incOpen.length, Math.max(1, inc30.length), '--down')),
      stat('Promises at risk', fmt(mhRisk.length), 'must-haves overdue or landing after the client’s show', 'work-risk', fracMeter(mhRisk.length, mhOpen.length, '--down')),
    ];
    startTitle = 'Shows to act on'; startCap = 'Next 30 days, red first, then by date. Open a row for the client’s 360.';
    const rows = next30.map(e => ({e, c:IX.co.get(e.pd)})).sort((a, b) => ({act:0, watch:1, clear:2, none:3}[a.c.flag.k] - {act:0, watch:1, clear:2, none:3}[b.c.flag.k]) || a.e.in - b.e.in);
    start = rows.slice(0, 6).map(({e, c}) => eventRow(e, c)).join('') || emptyRow('No shows in the next 30 days', 'Nothing on the radar for these filters.');
    blockTitle = 'Next 8 weeks'; blockCap = 'Shows per week, split by what is open for the client. Select a week to see its shows.';
    block = weeksChart(cos);
  } else if (role === 'engineering'){
    head = `${plural(bugs.length, 'open client bug')}. ${fmt(old90.length)} of them have been open for more than 90 days.`;
    lede = 'Every bug here is attached to a named client. Clear the old urgent ones first, and watch the teams whose clients have a show coming up.';
    stats = [
      stat('Open client bugs', fmt(bugs.length), `${bsev.Urgent} urgent · ${bsev.High} high`, 'quality-bugs', sevMeter(bsev)),
      stat('Urgent', fmt(bsev.Urgent), 'highest severity, open now', 'quality-urgent', fracMeter(bsev.Urgent, bugs.length, '--sev-u')),
      stat('Open for 90+ days', fmt(old90.length), 'close them or chase an owner', 'quality-old', fracMeter(old90.length, bugs.length, '--down')),
      stat('Shows with urgent or high bugs', fmt(pressureShows.length), 'starting in the next 30 days', 'quality-pressure', fracMeter(pressureShows.length, next30.length, '--down')),
    ];
    startTitle = 'Oldest urgent and high bugs'; startCap = 'Oldest first. Each one names the client it hurts.';
    start = bugs.filter(b => b.p === 'Urgent' || b.p === 'High').sort((a, b) => b.age - a.age).slice(0, 6).map(bugRow).join('');
    blockTitle = 'Team pressure'; blockCap = 'Open client bugs per team, split by severity. Select a segment to filter the bug list.';
    block = teamPressure(bugs);
  } else if (role === 'product'){
    const top = withCus[0];
    head = `${fmt(withCus.length)} feature requests have a named client behind them. The top one has ${plural(top ? top.cus.length : 0, 'client')} asking.`;
    lede = `Demand is ranked by who is asking: each customer counts once at its tier weight. ${fmt(D.meta.demandCounts.items)} raw requests fold into ${fmt(D.needs.length)} needs.`;
    stats = [
      stat('Needs with a customer', `${fmt(withCus.length)}<small> / ${fmt(D.needs.length)}</small>`, 'the rest stay tracked but unranked', 'demand', fracMeter(withCus.length, D.needs.length)),
      stat('Requests tier 1 is asking for', fmt(t1Needs.length), 'at least one tier 1 client behind them', 'demand-t1', fracMeter(t1Needs.length, withCus.length)),
      stat('Must-haves open', fmt(mhOpen.length), `${D.musthave.filter(m => m.step === 'Building').length} being built now`, 'work-mh', ladderMeter()),
      stat('Stories in progress', fmt(inProg.length), 'delivery in flight across all teams', 'work-built', fracMeter(inProg.length, D.stories.length)),
    ];
    startTitle = 'Top feature requests by signal'; startCap = 'Tier weights: T1 = 5, T2 = 3, T3 = 2, T4 = 1. Open one for what, why, outcome and every client asking.';
    start = withCus.slice(0, 6).map((n, i) => needRow(n, i + 1, withCus[0].signal)).join('');
    blockTitle = 'Must-have load by month'; blockCap = 'Committed days per month. Select a month to open it on the Work board.';
    block = mhLoadChart();
  } else if (role === 'sales'){
    const withBugs = renew.filter(c => c.open);
    head = `${plural(renew.length, 'renewal')} in the next 180 days. ${fmt(withBugs.length)} of those clients have open bugs.`;
    lede = 'Before a renewal or expansion call, check what the client is waiting on: open bugs, promises in flight, and what they keep asking for.';
    stats = [
      stat('Tier 1 clients', `${fmt(t1.length)}<small> / ${cos.length}</small>`, `${t1.filter(c => c.open).length} with open bugs`, 'clients-t1', fracMeter(t1.length, cos.length, '--ink')),
      stat('Renewals in 180 days', fmt(renew.length), 'dated renewals, soonest first', 'clients-renewal', fracMeter(withBugs.length, renew.length, '--down')),
      stat('Promises to named clients', fmt(D.musthave.filter(m => m.client && m.step !== 'Shipped').length), 'open must-haves with a client behind them', 'work-mh', ladderMeter()),
      stat('Requests tier 1 is asking for', fmt(t1Needs.length), 'the expansion conversation, ready-made', 'demand-t1', fracMeter(t1Needs.length, withCus.length)),
    ];
    startTitle = 'Renewals coming up'; startCap = 'Soonest first. The bar shows how close the date is within the next 180 days.';
    start = renew.slice(0, 6).map(renewRow).join('') || emptyRow('No dated renewals in the next 180 days', '');
    blockTitle = 'Delivered for tier 1 in 2026'; blockCap = 'Stories shipped and in progress per tier 1 client. Select a client for their 360.';
    const t1rows = t1.slice().sort((a, b) => (b.shipped + b.prog) - (a.shipped + a.prog));
    const max = Math.max(1, ...t1rows.map(c => c.shipped + c.prog));

function clientList(){
  let list = D.companies.filter(inFilters);
  const q = S.clients.q.trim().toLowerCase();

  const p = S.clients.preset;
  if (p === 'urgent') list = list.filter(c => c.sev.Urgent > 0);
  if (p === 'act') list = list.filter(c => c.flag.k === 'act');
  if (p === 't1') list = list.filter(c => c.tier === 1);
  if (p === 'renewal') list = list.filter(c => c.rin != null && c.rin >= 0 && c.rin <= 180);
  const s = S.clients.sort;
  const keyShow = c => c.next ? c.next.in : 9999;
  list.sort(s === 'health' ? (a, b) => a.health - b.health : s === 'problems' ? (a, b) => (b.open + b.incOpen * 3) - (a.open + a.incOpen * 3)

}

  const q = Q.q.trim().toLowerCase(); if (q) l = l.filter(b => (b.s + ' ' + b.key + ' ' + b.pds.map(pd => (IX.co.get(pd) || {}).name).join(' ')).toLowerCase().includes(q));

function heuristicFill(raw){
  const lines = String(raw || '').split(/\n+|(?<=[.!?])\s+/).map(x => x.replace(/^\s*[^:\n]{1,40}?\b\d{1,2}:\d{2}\b\s*:?\s*/, '').replace(/^\s*[A-Z][\w .()'-]{0,30}:\s+/, '').trim()).filter(x => x.length > 3);
  if (!lines.length) return {what:'', why:'', outcome:''};
  const isWant = x => /\b(wants?|needs?|ask(s|ing|ed)?|would like|should|can we|could we|request(s|ed)?|looking for)\b/i.test(x);
  const isWhy = x => /\b(because|currently|today|right now|at the moment|can'?t|cannot|never|problem|issue|without|manual(ly)?|have to|half of|by hand|struggl\w*)\b/i.test(x);
  const isOut = x => /\b(so that|so they|would|will|then they|same day|faster|easier|instead|stop|no longer)\b/i.test(x);
  let wi = lines.findIndex(x => isWant(x) && !isWhy(x)); if (wi < 0) wi = lines.findIndex(isWant); if (wi < 0) wi = 0;

  let m;
  if (!out && (m = what.match(/^(.*?)\s*,?\s*\b(so that|so they can)\b\s*(.+)$/i))){ what = m[1]; out = cap(m[3]); }
  if (!why && (m = what.match(/^(.*?)\s*,?\s*\bbecause\b\s*(.+)$/i))){ what = m[1]; why = cap(m[2]); }
  if (!why && lines.length === 1 && (m = what.match(/^(.+?)\s+and\s+(?:they|we)\s+(need|want)s?\s+(.+)$/i))){ why = cap(m[1]); what = cap('they ' + m[2] + ' ' + m[3]); }
  return {what:cap(what.replace(/[,;]\s*$/, '')), why, outcome:out};
}
